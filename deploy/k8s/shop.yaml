apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
# ---------------- api-gateway ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      nodeSelector: { workload: app }
      containers:
        - name: app
          image: shop/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=shop" }
            - { name: INVENTORY_URL, value: "http://inventory-service:8080" }
            - { name: ORDER_URL, value: "http://order-service:8080" }
          resources:
            requests: { cpu: 100m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shop
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: http, nodePort: 30080, name: http }]
---
# ---------------- order-service ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop
spec:
  # in-memory orders
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      nodeSelector: { workload: app }
      containers:
        - name: app
          image: shop/order:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=shop" }
            - { name: INVENTORY_URL, value: "http://inventory-service:8080" }
            - { name: PAYMENT_URL, value: "http://payment-service:8080" }
            - { name: UPSTREAM_TIMEOUT_MS, value: "2000" }
          resources:
            requests: { cpu: 100m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop
spec:
  selector: { app: order-service }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
